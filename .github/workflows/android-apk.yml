name: Build Android Receiver APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android Receiver APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "DormCast-Receiver-${VERSION}.apk"
          sha256sum "DormCast-Receiver-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DormCast-Receiver-APK
          path: DormCast-Receiver-*.apk
          if-no-files-found: error
