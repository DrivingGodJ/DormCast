<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="宿舍之音 DormCast — 电脑放歌，宿舍一起听">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b100d"/>
      <stop offset="55%" stop-color="#111914"/>
      <stop offset="100%" stop-color="#16231a"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="72%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#c9f37f" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c9f37f" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9f37f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="18%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#7fe3c9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7fe3c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcff6a"/>
    </linearGradient>
    <linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="850" y1="215" x2="1050" y2="215">
      <stop offset="0%" stop-color="#c9f37f" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#dcff6a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7fe3c9" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#243329" stroke-width="0.8" opacity="0.45"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="420" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }

      @keyframes wavePulse1 {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes wavePulse2 {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
      @keyframes rippleExpand {
        0% { transform: scale(0.45); opacity: 0.65; }
        100% { transform: scale(1.65); opacity: 0; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 64; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes eq1 { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1.0); } }
      @keyframes eq2 { 0%, 100% { transform: scaleY(0.95); } 50% { transform: scaleY(0.35); } }
      @keyframes eq3 { 0%, 100% { transform: scaleY(0.60); } 50% { transform: scaleY(1.1); } }
      @keyframes eq4 { 0%, 100% { transform: scaleY(0.85); } 50% { transform: scaleY(0.40); } }
      @keyframes syncBlink {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .arc-inner { animation: wavePulse1 1.8s ease-in-out infinite; }
      .arc-outer { animation: wavePulse2 1.8s ease-in-out 0.35s infinite; }
      .ripple-1 { transform-origin: 790px 215px; animation: rippleExpand 3.2s ease-out infinite; }
      .ripple-2 { transform-origin: 790px 215px; animation: rippleExpand 3.2s ease-out 1.6s infinite; }
      .beam-flow { stroke-dasharray: 10 22; animation: flowDash 1.4s linear infinite; }
      .beam-flow-2 { stroke-dasharray: 10 22; animation: flowDash 1.4s linear 0.35s infinite; }
      .beam-flow-3 { stroke-dasharray: 10 22; animation: flowDash 1.4s linear 0.7s infinite; }
      .eq-bar { transform-box: fill-box; transform-origin: bottom center; }
      .eq-1 { animation: eq1 0.9s ease-in-out infinite; }
      .eq-2 { animation: eq2 0.78s ease-in-out infinite; }
      .eq-3 { animation: eq3 1.02s ease-in-out infinite; }
      .eq-4 { animation: eq4 0.84s ease-in-out infinite; }
      .sync-dot { animation: syncBlink 1.2s ease-in-out infinite; }
      .float-1 { animation: floatSoft 3.4s ease-in-out infinite; }
      .float-2 { animation: floatSoft 3.4s ease-in-out 0.8s infinite; }
      .float-3 { animation: floatSoft 3.4s ease-in-out 1.6s infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1200" height="420" fill="url(#bgGrad)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#limeGlow)"/>
    <rect width="1200" height="420" fill="url(#leftGlow)"/>

    <!-- Left Brand Column -->
    <g transform="translate(64, 58)">
      <!-- Brand Badge -->
      <rect x="0" y="0" width="218" height="36" rx="18" fill="#18231b" stroke="#3c5242" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4.5" fill="#c9f37f" class="sync-dot"/>
      <text x="34" y="23" fill="#c9f37f" font-size="13" font-weight="700" letter-spacing="1.4" class="mono">DORMCAST · v0.6</text>

      <!-- Logo + Title -->
      <g transform="translate(0, 56)">
        <rect x="0" y="4" width="64" height="64" rx="16" fill="#18241b" stroke="#c9f37f" stroke-opacity="0.55" stroke-width="1.4"/>
        <g transform="translate(12, 16) scale(1.25)">
          <circle cx="16" cy="16" r="3.2" fill="#c9f37f"/>
          <path d="M9 9a10 10 0 0 0 0 14M23 9a10 10 0 0 1 0 14" stroke="#c9f37f" stroke-width="2.1" stroke-linecap="round" fill="none" class="arc-inner"/>
          <path d="M5 5a16 16 0 0 0 0 22M27 5a16 16 0 0 1 0 22" stroke="#c9f37f" stroke-width="2.1" stroke-linecap="round" fill="none" class="arc-outer"/>
        </g>
        <text x="82" y="42" fill="#f0f5ee" font-size="44" font-weight="800" letter-spacing="1" class="sans">宿舍之音</text>
        <text x="84" y="68" fill="#b0beb1" font-size="14" font-weight="600" letter-spacing="3.5" class="mono">DORMCAST</text>
      </g>

      <!-- Main Value Prop -->
      <text x="0" y="176" fill="url(#accentText)" font-size="28" font-weight="800" class="sans">把全寝室设备，连成一台同步音响</text>
      <text x="0" y="210" fill="#b0beb1" font-size="16" font-weight="500" class="sans">电脑放歌，局域网网页扫码即听 · 无需账号 · 无需安装 App</text>
      <text x="0" y="234" fill="#7c8f80" font-size="13.5" class="mono">Broadcast Windows system audio to every LAN browser in sync</text>

      <!-- Feature Pills -->
      <g transform="translate(0, 262)">
        <rect x="0" y="0" width="124" height="32" rx="9" fill="#19241c" stroke="#344539" stroke-width="1.1"/>
        <text x="62" y="21" text-anchor="middle" fill="#e6f0e4" font-size="12.5" font-weight="600" class="sans">原生 WinUI 3</text>

        <rect x="134" y="0" width="152" height="32" rx="9" fill="#19241c" stroke="#344539" stroke-width="1.1"/>
        <text x="210" y="21" text-anchor="middle" fill="#c9f37f" font-size="12.5" font-weight="600" class="mono">48kHz Opus / WebRTC</text>

        <rect x="296" y="0" width="136" height="32" rx="9" fill="#19241c" stroke="#344539" stroke-width="1.1"/>
        <text x="364" y="21" text-anchor="middle" fill="#7fe3c9" font-size="12.5" font-weight="600" class="sans">网页遥控切歌音量</text>

        <rect x="442" y="0" width="108" height="32" rx="9" fill="#19241c" stroke="#344539" stroke-width="1.1"/>
        <text x="496" y="21" text-anchor="middle" fill="#b0beb1" font-size="12.5" font-weight="600" class="mono">MIT 开源免费</text>
      </g>
    </g>

    <!-- Right Animated Dorm Soundfield Stage -->
    <g>
      <!-- Expanding Acoustic Ripples from Host -->
      <circle cx="790" cy="215" r="95" fill="none" stroke="#c9f37f" stroke-width="1.6" class="ripple-1"/>
      <circle cx="790" cy="215" r="95" fill="none" stroke="#7fe3c9" stroke-width="1.2" class="ripple-2"/>

      <!-- Curved Energy Beams (Base + Animated Packets) -->
      <path d="M 852 192 Q 945 102 1030 96" fill="none" stroke="#2c4433" stroke-width="3" stroke-linecap="round"/>
      <path d="M 852 192 Q 945 102 1030 96" fill="none" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" class="beam-flow"/>

      <path d="M 862 215 Q 950 215 1044 215" fill="none" stroke="#2c4433" stroke-width="3" stroke-linecap="round"/>
      <path d="M 862 215 Q 950 215 1044 215" fill="none" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" class="beam-flow-2"/>

      <path d="M 852 238 Q 945 326 1030 332" fill="none" stroke="#2c4433" stroke-width="3" stroke-linecap="round"/>
      <path d="M 852 238 Q 945 326 1030 332" fill="none" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" class="beam-flow-3"/>

      <!-- Host Windows Laptop Card -->
      <g transform="translate(708, 146)">
        <rect x="0" y="0" width="164" height="122" rx="14" fill="#18231b" stroke="#c9f37f" stroke-opacity="0.7" stroke-width="1.5"/>
        <rect x="10" y="10" width="144" height="84" rx="8" fill="#0f1711" stroke="#2a3a2f" stroke-width="1"/>
        <!-- Animated 5-bar EQ inside Host Screen -->
        <rect x="46" y="34" width="10" height="44" rx="4" fill="#c9f37f" class="eq-bar eq-1"/>
        <rect x="62" y="24" width="10" height="54" rx="4" fill="#dcff6a" class="eq-bar eq-2"/>
        <rect x="78" y="30" width="10" height="48" rx="4" fill="#c9f37f" class="eq-bar eq-3"/>
        <rect x="94" y="22" width="10" height="56" rx="4" fill="#7fe3c9" class="eq-bar eq-4"/>
        <rect x="110" y="38" width="10" height="40" rx="4" fill="#c9f37f" class="eq-bar eq-1"/>
        <!-- Laptop Base & Label -->
        <rect x="18" y="103" width="128" height="6" rx="3" fill="#2c3c31"/>
        <rect x="-14" y="128" width="192" height="10" rx="5" fill="#223026" stroke="#394c3e" stroke-width="1"/>
        <text x="82" y="158" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">Windows 主机</text>
        <text x="82" y="175" text-anchor="middle" fill="#c9f37f" font-size="11" class="mono">LIVE · 250ms Target</text>
      </g>

      <!-- Receiver Device 1: iOS Phone -->
      <g class="float-1">
        <g transform="translate(1030, 48)">
          <rect x="0" y="0" width="124" height="86" rx="14" fill="#19241c" stroke="#3c5243" stroke-width="1.3"/>
          <circle cx="20" cy="22" r="5" fill="#c9f37f" class="sync-dot"/>
          <text x="32" y="26" fill="#f0f5ee" font-size="12.5" font-weight="700" class="sans">手机 A · iOS</text>
          <text x="16" y="48" fill="#8ea393" font-size="11" class="mono">Browser · 7ms</text>
          <rect x="16" y="60" width="92" height="8" rx="4" fill="#101712"/>
          <rect x="16" y="60" width="70" height="8" rx="4" fill="#c9f37f"/>
        </g>
      </g>

      <!-- Receiver Device 2: Android / Huawei -->
      <g class="float-2">
        <g transform="translate(1044, 172)">
          <rect x="0" y="0" width="124" height="86" rx="14" fill="#19241c" stroke="#c9f37f" stroke-opacity="0.65" stroke-width="1.3"/>
          <circle cx="20" cy="22" r="5" fill="#dcff6a" class="sync-dot"/>
          <text x="32" y="26" fill="#f0f5ee" font-size="12.5" font-weight="700" class="sans">手机 B · 遥控</text>
          <text x="16" y="48" fill="#c9f37f" font-size="11" class="mono">切歌 · 调音量</text>
          <rect x="16" y="60" width="92" height="8" rx="4" fill="#101712"/>
          <rect x="16" y="60" width="76" height="8" rx="4" fill="#dcff6a"/>
        </g>
      </g>

      <!-- Receiver Device 3: Tablet / Laptop -->
      <g class="float-3">
        <g transform="translate(1030, 290)">
          <rect x="0" y="0" width="124" height="86" rx="14" fill="#19241c" stroke="#3c5243" stroke-width="1.3"/>
          <circle cx="20" cy="22" r="5" fill="#7fe3c9" class="sync-dot"/>
          <text x="32" y="26" fill="#f0f5ee" font-size="12.5" font-weight="700" class="sans">电脑 / 平板</text>
          <text x="16" y="48" fill="#8ea393" font-size="11" class="mono">LAN · Synced</text>
          <rect x="16" y="60" width="92" height="8" rx="4" fill="#101712"/>
          <rect x="16" y="60" width="66" height="8" rx="4" fill="#7fe3c9"/>
        </g>
      </g>
    </g>

    <!-- Outer Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="22" fill="none" stroke="#2f4235" stroke-width="1.5"/>
  </g>
</svg>
