<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="DormCast 局域网音频链路与共同时间线同步原理动画">
  <defs>
    <linearGradient id="syncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b100d"/>
      <stop offset="100%" stop-color="#131c16"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9f37f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9f37f" stop-opacity="0.88"/>
    </linearGradient>
    <clipPath id="syncClip">
      <rect x="0" y="0" width="1200" height="380" rx="20"/>
    </clipPath>
    <style>
      .sans { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }

      @keyframes pipeFlow {
        0% { stroke-dashoffset: 32; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes compGrow {
        0%, 14% { transform: scaleX(0.05); opacity: 0.3; }
        42%, 82% { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0.05); opacity: 0.3; }
      }
      @keyframes lockPulse {
        0%, 38% { opacity: 0.35; }
        46%, 80% { opacity: 1; }
        100% { opacity: 0.35; }
      }
      @keyframes syncBeat {
        0%, 40% { transform: scale(0.85); opacity: 0.5; }
        50%, 62%, 74% { transform: scale(1.25); opacity: 1; }
        56%, 68%, 80% { transform: scale(0.95); opacity: 0.85; }
        100% { transform: scale(0.85); opacity: 0.5; }
      }

      .pipe { stroke-dasharray: 6 10; animation: pipeFlow 1.1s linear infinite; }
      .comp-bar { transform-box: fill-box; transform-origin: left center; animation: compGrow 5.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .target-line { animation: lockPulse 5.4s ease-in-out infinite; }
      .play-head { transform-box: fill-box; transform-origin: center; animation: syncBeat 5.4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#syncClip)">
    <rect width="1200" height="380" fill="url(#syncBg)"/>

    <!-- Header -->
    <text x="38" y="38" fill="#c9f37f" font-size="12" font-weight="700" letter-spacing="2" class="mono">COMMON TIMELINE · AUDIO PIPELINE &amp; HOST COMPENSATION</text>
    <text x="1162" y="38" text-anchor="end" fill="#829686" font-size="12" class="sans">主机侧独立发送补偿 · 250ms 起按 50ms 档位自适应</text>

    <!-- TOP: Audio Pipeline Row -->
    <g transform="translate(38, 56)">
      <!-- Step boxes -->
      <rect x="0" y="0" width="186" height="54" rx="12" fill="#18221b" stroke="#314236" stroke-width="1.1"/>
      <text x="93" y="23" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">Windows 播放器</text>
      <text x="93" y="42" text-anchor="middle" fill="#8ca090" font-size="10.5" class="mono">音乐 / 视频 / 游戏</text>

      <line x1="190" y1="27" x2="226" y2="27" stroke="#c9f37f" stroke-width="2.2" class="pipe"/>

      <rect x="230" y="0" width="196" height="54" rx="12" fill="#18221b" stroke="#314236" stroke-width="1.1"/>
      <text x="328" y="23" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">VB-CABLE / WASAPI</text>
      <text x="328" y="42" text-anchor="middle" fill="#8ca090" font-size="10.5" class="mono">共享事件回环采集</text>

      <line x1="430" y1="27" x2="466" y2="27" stroke="#c9f37f" stroke-width="2.2" class="pipe"/>

      <rect x="470" y="0" width="186" height="54" rx="12" fill="#18221b" stroke="#c9f37f" stroke-opacity="0.55" stroke-width="1.1"/>
      <text x="563" y="23" text-anchor="middle" fill="#c9f37f" font-size="13" font-weight="700" class="mono">48kHz Opus</text>
      <text x="563" y="42" text-anchor="middle" fill="#9bb09f" font-size="10.5" class="mono">128kbps · 统一时间线</text>

      <line x1="660" y1="27" x2="696" y2="27" stroke="#c9f37f" stroke-width="2.2" class="pipe"/>

      <rect x="700" y="0" width="204" height="54" rx="12" fill="#18221b" stroke="#314236" stroke-width="1.1"/>
      <text x="802" y="23" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="mono">WebRTC / SRTP</text>
      <text x="802" y="42" text-anchor="middle" fill="#7fe3c9" font-size="10.5" class="sans">纯局域网 · 无外部服务器</text>

      <line x1="908" y1="27" x2="944" y2="27" stroke="#c9f37f" stroke-width="2.2" class="pipe"/>

      <rect x="948" y="0" width="176" height="54" rx="12" fill="#1d2b20" stroke="#c9f37f" stroke-width="1.2"/>
      <text x="1036" y="23" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">多端浏览器同步听</text>
      <text x="1036" y="42" text-anchor="middle" fill="#c9f37f" font-size="10.5" class="mono">Host + Phones + PCs</text>
    </g>

    <!-- BOTTOM: 4-Track Common Timeline Alignment Visualization -->
    <g transform="translate(38, 134)">
      <rect x="0" y="0" width="1124" height="218" rx="16" fill="#141d17" stroke="#2d3e32" stroke-width="1.2"/>

      <!-- Legend -->
      <rect x="24" y="16" width="14" height="10" rx="3" fill="#4f7a6d"/>
      <text x="44" y="25" fill="#9fb3a3" font-size="11.5" class="sans">设备实测基础路径延迟</text>
      <rect x="196" y="16" width="14" height="10" rx="3" fill="#c9f37f"/>
      <text x="216" y="25" fill="#c9f37f" font-size="11.5" class="sans">主机侧动态发送补偿（后台网页定时器暂停也不受影响）</text>

      <!-- Target Line Label -->
      <rect x="850" y="10" width="152" height="24" rx="12" fill="#213425" stroke="#c9f37f" stroke-width="1.1" class="target-line"/>
      <text x="926" y="26" text-anchor="middle" fill="#dcff6a" font-size="11.5" font-weight="700" class="mono">统一目标 · 250ms</text>

      <!-- Track 1: Host Speaker (65ms + 185ms = 250ms) -->
      <g transform="translate(24, 52)">
        <text x="0" y="20" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">主机扬声器</text>
        <rect x="150" y="5" width="750" height="22" rx="6" fill="#0d1410"/>
        <rect x="150" y="5" width="195" height="22" rx="6" fill="#4f7a6d"/>
        <text x="247" y="20" text-anchor="middle" fill="#e6f2ec" font-size="11" class="mono">65ms</text>
        <rect x="345" y="5" width="555" height="22" rx="6" fill="url(#compGrad)" class="comp-bar"/>
        <text x="622" y="20" text-anchor="middle" fill="#13210d" font-size="11" font-weight="700" class="mono">+185ms 本地延迟缓冲</text>
        <circle cx="900" cy="16" r="7" fill="#dcff6a" class="play-head"/>
        <text x="930" y="20" fill="#c9f37f" font-size="12" font-weight="700" class="mono">250ms ✓</text>
      </g>

      <!-- Track 2: Phone A (118ms + 132ms = 250ms) -->
      <g transform="translate(24, 90)">
        <text x="0" y="20" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">手机 A · Wi-Fi 5G</text>
        <rect x="150" y="5" width="750" height="22" rx="6" fill="#0d1410"/>
        <rect x="150" y="5" width="354" height="22" rx="6" fill="#5e7f5a"/>
        <text x="327" y="20" text-anchor="middle" fill="#edf5ea" font-size="11" class="mono">118ms</text>
        <rect x="504" y="5" width="396" height="22" rx="6" fill="url(#compGrad)" class="comp-bar"/>
        <text x="702" y="20" text-anchor="middle" fill="#13210d" font-size="11" font-weight="700" class="mono">+132ms 发送补偿</text>
        <circle cx="900" cy="16" r="7" fill="#dcff6a" class="play-head"/>
        <text x="930" y="20" fill="#c9f37f" font-size="12" font-weight="700" class="mono">250ms ✓</text>
      </g>

      <!-- Track 3: Phone B (174ms + 76ms = 250ms) -->
      <g transform="translate(24, 128)">
        <text x="0" y="20" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">手机 B · 信号较弱</text>
        <rect x="150" y="5" width="750" height="22" rx="6" fill="#0d1410"/>
        <rect x="150" y="5" width="522" height="22" rx="6" fill="#7c754a"/>
        <text x="411" y="20" text-anchor="middle" fill="#f5f1de" font-size="11" class="mono">174ms</text>
        <rect x="672" y="5" width="228" height="22" rx="6" fill="url(#compGrad)" class="comp-bar"/>
        <text x="786" y="20" text-anchor="middle" fill="#13210d" font-size="11" font-weight="700" class="mono">+76ms 补偿</text>
        <circle cx="900" cy="16" r="7" fill="#dcff6a" class="play-head"/>
        <text x="930" y="20" fill="#c9f37f" font-size="12" font-weight="700" class="mono">250ms ✓</text>
      </g>

      <!-- Track 4: Phone C (192ms + 58ms = 250ms) -->
      <g transform="translate(24, 166)">
        <text x="0" y="20" fill="#f0f5ee" font-size="13" font-weight="700" class="sans">手机 C · 后台收听</text>
        <rect x="150" y="5" width="750" height="22" rx="6" fill="#0d1410"/>
        <rect x="150" y="5" width="576" height="22" rx="6" fill="#7d614a"/>
        <text x="438" y="20" text-anchor="middle" fill="#f7ebe1" font-size="11" class="mono">192ms</text>
        <rect x="726" y="5" width="174" height="22" rx="6" fill="url(#compGrad)" class="comp-bar"/>
        <text x="813" y="20" text-anchor="middle" fill="#13210d" font-size="11" font-weight="700" class="mono">+58ms 补偿</text>
        <circle cx="900" cy="16" r="7" fill="#dcff6a" class="play-head"/>
        <text x="930" y="20" fill="#c9f37f" font-size="12" font-weight="700" class="mono">250ms ✓</text>
      </g>

      <!-- Vertical Unified 250ms Target Laser Line -->
      <line x1="924" y1="38" x2="924" y2="202" stroke="#dcff6a" stroke-width="2" stroke-dasharray="5 4" class="target-line"/>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="20" fill="none" stroke="#2c3e32" stroke-width="1.5"/>
  </g>
</svg>
