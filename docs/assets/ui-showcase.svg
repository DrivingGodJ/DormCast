<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="DormCast WinUI 3 主机端与浏览器接收端联动界面示意图">
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b100d"/>
      <stop offset="100%" stop-color="#141e17"/>
    </linearGradient>
    <radialGradient id="vinyl1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c9f37f" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#3a6640" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#192a1f"/>
    </radialGradient>
    <radialGradient id="vinyl2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7fe3c9" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#285866" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#14242d"/>
    </radialGradient>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="500" rx="20"/>
    </clipPath>
    <style>
      .sans { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseFlow {
        0% { stroke-dashoffset: 36; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes eqA { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
      @keyframes eqB { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
      @keyframes eqC { 0%, 100% { transform: scaleY(0.65); } 50% { transform: scaleY(1.05); } }
      @keyframes glowPulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

      .vinyl-spin { transform-box: fill-box; transform-origin: center; animation: spinSlow 14s linear infinite; }
      .link-flow { stroke-dasharray: 6 12; animation: pulseFlow 1.1s linear infinite; }
      .bar { transform-box: fill-box; transform-origin: bottom center; }
      .b1 { animation: eqA 0.85s ease-in-out infinite; }
      .b2 { animation: eqB 0.72s ease-in-out infinite; }
      .b3 { animation: eqC 0.96s ease-in-out infinite; }
      .b4 { animation: eqA 0.78s ease-in-out 0.2s infinite; }
      .dot-live { animation: glowPulse 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="500" fill="url(#stageBg)"/>

    <!-- Top Caption -->
    <text x="38" y="38" fill="#c9f37f" font-size="12" font-weight="700" letter-spacing="2" class="mono">UI SHOWCASE · DESKTOP HOST &amp; WEB RECEIVER</text>
    <text x="1162" y="38" text-anchor="end" fill="#829686" font-size="12" class="sans">WinUI 3 半透明主机 · 网页双向遥控 · 专辑封面动态取色</text>

    <!-- LEFT: WinUI 3 Desktop Host Window -->
    <g transform="translate(36, 58)">
      <rect x="0" y="0" width="590" height="408" rx="16" fill="#17211a" stroke="#384c3e" stroke-width="1.4"/>
      <!-- Title bar -->
      <path d="M 0 16 Q 0 0 16 0 L 574 0 Q 590 0 590 16 L 590 34 L 0 34 Z" fill="#101712"/>
      <circle cx="22" cy="17" r="4" fill="#c9f37f"/>
      <text x="34" y="21" fill="#dce6dc" font-size="12" font-weight="600" class="sans">宿舍之音 · DormCast v0.6.0</text>
      <text x="530" y="21" fill="#7c8f80" font-size="12" class="mono">—  □  ×</text>

      <!-- Header -->
      <text x="24" y="68" fill="#f0f5ee" font-size="22" font-weight="800" class="sans">宿舍之音</text>
      <text x="24" y="86" fill="#8ca090" font-size="10.5" letter-spacing="1.6" class="mono">WINUI 3 · 局域网音乐广播</text>
      <rect x="404" y="50" width="90" height="28" rx="14" fill="#203224" stroke="#c9f37f" stroke-width="1"/>
      <circle cx="420" cy="64" r="4" fill="#c9f37f" class="dot-live"/>
      <text x="431" y="68" fill="#c9f37f" font-size="12" font-weight="700" class="sans">正在广播</text>
      <rect x="502" y="50" width="66" height="28" rx="8" fill="#222e25" stroke="#36483b" stroke-width="1"/>
      <text x="535" y="68" text-anchor="middle" fill="#dce6dc" font-size="11.5" class="sans">同步设置</text>

      <!-- Left Music Card -->
      <rect x="22" y="102" width="346" height="218" rx="13" fill="#1e2921" stroke="#324437" stroke-width="1"/>
      <!-- Spinning Vinyl Cover -->
      <g transform="translate(38, 118)">
        <rect x="0" y="0" width="102" height="102" rx="12" fill="url(#vinyl1)" stroke="#4c6b50" stroke-width="1"/>
        <g class="vinyl-spin">
          <circle cx="51" cy="51" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="18 8"/>
          <circle cx="51" cy="51" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="12 10"/>
          <circle cx="51" cy="51" r="12" fill="#101612" stroke="#c9f37f" stroke-width="2"/>
          <circle cx="51" cy="51" r="3.5" fill="#c9f37f"/>
        </g>
      </g>
      <text x="154" y="136" fill="#c9f37f" font-size="11" font-weight="700" class="sans">主机正在播放 · SMTC</text>
      <text x="154" y="160" fill="#f0f5ee" font-size="17" font-weight="800" class="sans">夜航信号 · Late Night</text>
      <text x="154" y="182" fill="#cfdcd0" font-size="13" class="sans">Dorm 404 Club</text>
      <text x="154" y="204" fill="#8ca090" font-size="11" class="mono">48kHz Stereo · Opus 128k</text>

      <!-- Bidirectional Volume Card -->
      <rect x="38" y="236" width="314" height="68" rx="10" fill="#131b15" stroke="#364a3b" stroke-width="1"/>
      <text x="50" y="257" fill="#dce6dc" font-size="12" font-weight="700" class="sans">系统与广播音量（双向联动）</text>
      <text x="340" y="257" text-anchor="end" fill="#c9f37f" font-size="13" font-weight="700" class="mono">78%</text>
      <rect x="50" y="270" width="290" height="7" rx="3.5" fill="#27342b"/>
      <rect x="50" y="270" width="226" height="7" rx="3.5" fill="#c9f37f"/>
      <circle cx="276" cy="273.5" r="7.5" fill="#f4f9f1" stroke="#c9f37f" stroke-width="3"/>
      <text x="50" y="294" fill="#819485" font-size="10" class="sans">Windows 音量键 · 桌面滑块 · 浏览器遥控实时同步</text>

      <!-- Right QR Card -->
      <rect x="382" y="102" width="186" height="218" rx="13" fill="#1e2921" stroke="#324437" stroke-width="1"/>
      <text x="398" y="126" fill="#f0f5ee" font-size="14" font-weight="700" class="sans">扫码，一起听</text>
      <rect x="398" y="138" width="74" height="22" rx="6" fill="#253829" stroke="#c9f37f" stroke-width="1"/>
      <text x="435" y="153" text-anchor="middle" fill="#c9f37f" font-size="10.5" font-weight="700" class="sans">mDNS 固定</text>
      <rect x="478" y="138" width="74" height="22" rx="6" fill="#172019" stroke="#344539" stroke-width="1"/>
      <text x="515" y="153" text-anchor="middle" fill="#8ea393" font-size="10.5" class="sans">IPv4 兼容</text>
      <!-- Vector QR Box -->
      <rect x="424" y="172" width="102" height="102" rx="9" fill="#f2f7f0"/>
      <g transform="translate(434, 182)" fill="#101612">
        <rect x="0" y="0" width="24" height="24" rx="3"/><rect x="4" y="4" width="16" height="16" rx="2" fill="#f2f7f0"/><rect x="8" y="8" width="8" height="8" rx="1"/>
        <rect x="58" y="0" width="24" height="24" rx="3"/><rect x="62" y="4" width="16" height="16" rx="2" fill="#f2f7f0"/><rect x="66" y="8" width="8" height="8" rx="1"/>
        <rect x="0" y="58" width="24" height="24" rx="3"/><rect x="4" y="62" width="16" height="16" rx="2" fill="#f2f7f0"/><rect x="8" y="66" width="8" height="8" rx="1"/>
        <rect x="32" y="4" width="8" height="8" rx="1.5"/><rect x="44" y="12" width="8" height="14" rx="1.5"/>
        <rect x="30" y="28" width="14" height="8" rx="1.5"/><rect x="48" y="34" width="10" height="10" rx="1.5"/>
        <rect x="64" y="34" width="16" height="8" rx="1.5"/><rect x="6" y="36" width="16" height="8" rx="1.5"/>
        <rect x="32" y="50" width="10" height="16" rx="1.5"/><rect x="48" y="56" width="12" height="10" rx="1.5"/>
        <rect x="66" y="54" width="14" height="14" rx="1.5"/><rect x="34" y="72" width="20" height="8" rx="1.5"/>
        <rect x="62" y="74" width="18" height="8" rx="1.5"/>
      </g>
      <text x="475" y="298" text-anchor="middle" fill="#8ca090" font-size="10" class="mono">dorm-404.local:17888</text>

      <!-- Bottom Metrics + Action -->
      <rect x="22" y="334" width="160" height="54" rx="11" fill="#1e2921" stroke="#324437" stroke-width="1"/>
      <text x="36" y="354" fill="#8ca090" font-size="10.5" class="sans">正在收听</text>
      <text x="36" y="376" fill="#f0f5ee" font-size="18" font-weight="800" class="mono">3 <tspan font-size="12" font-weight="500" class="sans">台设备</tspan></text>

      <rect x="196" y="334" width="172" height="54" rx="11" fill="#1e2921" stroke="#324437" stroke-width="1"/>
      <text x="210" y="354" fill="#8ca090" font-size="10.5" class="sans">统一延迟目标</text>
      <text x="210" y="376" fill="#c9f37f" font-size="18" font-weight="800" class="mono">250 ms</text>

      <rect x="382" y="334" width="186" height="54" rx="11" fill="#203224" stroke="#c9f37f" stroke-width="1.3"/>
      <text x="475" y="366" text-anchor="middle" fill="#c9f37f" font-size="14" font-weight="700" class="sans">停止广播 · 48kHz Opus</text>
    </g>

    <!-- Animated Bi-Directional Link Arrow -->
    <g>
      <line x1="636" y1="262" x2="704" y2="262" stroke="#2c4433" stroke-width="3" stroke-linecap="round"/>
      <line x1="636" y1="262" x2="704" y2="262" stroke="#c9f37f" stroke-width="3" stroke-linecap="round" class="link-flow"/>
      <rect x="640" y="226" width="60" height="24" rx="12" fill="#18241b" stroke="#c9f37f" stroke-width="1"/>
      <text x="670" y="242" text-anchor="middle" fill="#c9f37f" font-size="10.5" font-weight="700" class="sans">⇄ 联动</text>
    </g>

    <!-- RIGHT 1: Web Receiver Phone (Classic Lime Theme + v0.6.0 Remote Control) -->
    <g transform="translate(712, 62)">
      <rect x="0" y="0" width="222" height="404" rx="30" fill="#1c251f" stroke="#475c4d" stroke-width="1.8"/>
      <rect x="9" y="9" width="204" height="386" rx="22" fill="#101612"/>
      <!-- Dynamic Island -->
      <rect x="82" y="18" width="58" height="13" rx="6.5" fill="#060907"/>
      <!-- App Bar -->
      <circle cx="28" cy="48" r="5" fill="#c9f37f"/>
      <text x="39" y="52" fill="#f0f5ee" font-size="12" font-weight="700" class="sans">宿舍之音</text>
      <circle cx="152" cy="48" r="3.5" fill="#c9f37f" class="dot-live"/>
      <text x="160" y="52" fill="#9db09f" font-size="10" class="sans">局域网直连</text>

      <!-- Player Card -->
      <rect x="18" y="66" width="186" height="224" rx="14" fill="#19221c" stroke="#314136" stroke-width="1"/>
      <rect x="30" y="78" width="54" height="54" rx="10" fill="url(#vinyl1)"/>
      <circle cx="57" cy="105" r="8" fill="#101612" stroke="#c9f37f" stroke-width="1.6"/>
      <text x="94" y="94" fill="#c9f37f" font-size="9.5" font-weight="700" class="sans">● 正在同步收听</text>
      <text x="94" y="112" fill="#f0f5ee" font-size="13" font-weight="800" class="sans">夜航信号</text>
      <!-- Live EQ Bars -->
      <g transform="translate(94, 120)">
        <rect x="0" y="2" width="3" height="10" rx="1.5" fill="#c9f37f" class="bar b1"/>
        <rect x="5" y="0" width="3" height="12" rx="1.5" fill="#dcff6a" class="bar b2"/>
        <rect x="10" y="3" width="3" height="9" rx="1.5" fill="#c9f37f" class="bar b3"/>
        <rect x="15" y="1" width="3" height="11" rx="1.5" fill="#c9f37f" class="bar b4"/>
        <text x="24" y="10" fill="#8ea393" font-size="9" class="mono">LIVE 48kHz</text>
      </g>

      <!-- v0.6.0 Remote Control Box -->
      <rect x="28" y="146" width="166" height="132" rx="11" fill="#212d24" stroke="#c9f37f" stroke-opacity="0.7" stroke-width="1.1"/>
      <text x="38" y="166" fill="#f0f5ee" font-size="11" font-weight="700" class="sans">主机遥控</text>
      <rect x="90" y="154" width="40" height="16" rx="8" fill="#293d2c"/>
      <text x="110" y="165" text-anchor="middle" fill="#c9f37f" font-size="9" font-weight="700" class="mono">v0.6</text>

      <!-- Prev / Pause / Next -->
      <rect x="38" y="178" width="36" height="32" rx="8" fill="#2c3a30"/>
      <text x="56" y="199" text-anchor="middle" fill="#e6f0e4" font-size="13">⏮</text>
      <rect x="80" y="178" width="62" height="32" rx="8" fill="#c9f37f"/>
      <text x="111" y="199" text-anchor="middle" fill="#182710" font-size="12" font-weight="800" class="sans">⏸ 暂停</text>
      <rect x="148" y="178" width="36" height="32" rx="8" fill="#2c3a30"/>
      <text x="166" y="199" text-anchor="middle" fill="#e6f0e4" font-size="13">⏭</text>

      <!-- Remote Volume Slider -->
      <rect x="38" y="228" width="118" height="6" rx="3" fill="#131b15"/>
      <rect x="38" y="228" width="92" height="6" rx="3" fill="#c9f37f"/>
      <circle cx="130" cy="231" r="6.5" fill="#f4f9f1" stroke="#c9f37f" stroke-width="2.5"/>
      <text x="184" y="235" text-anchor="end" fill="#c9f37f" font-size="11" font-weight="700" class="mono">78%</text>
      <text x="38" y="262" fill="#9bb09f" font-size="9.5" class="sans">切歌 · 暂停 · 系统音量同步</text>

      <!-- Telemetry Row -->
      <rect x="18" y="302" width="58" height="52" rx="10" fill="#19221c" stroke="#314136" stroke-width="1"/>
      <text x="47" y="320" text-anchor="middle" fill="#8ca090" font-size="9" class="sans">往返</text>
      <text x="47" y="340" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="mono">7ms</text>

      <rect x="82" y="302" width="58" height="52" rx="10" fill="#19221c" stroke="#314136" stroke-width="1"/>
      <text x="111" y="320" text-anchor="middle" fill="#8ca090" font-size="9" class="sans">缓冲</text>
      <text x="111" y="340" text-anchor="middle" fill="#f0f5ee" font-size="13" font-weight="700" class="mono">40ms</text>

      <rect x="146" y="302" width="58" height="52" rx="10" fill="#19221c" stroke="#314136" stroke-width="1"/>
      <text x="175" y="320" text-anchor="middle" fill="#8ca090" font-size="9" class="sans">目标</text>
      <text x="175" y="340" text-anchor="middle" fill="#c9f37f" font-size="13" font-weight="700" class="mono">250ms</text>

      <text x="111" y="378" text-anchor="middle" fill="#738777" font-size="9.5" class="sans">默认青柠深林主题</text>
    </g>

    <!-- RIGHT 2: Web Receiver Phone (Cover-Adaptive Dynamic Palette!) -->
    <g transform="translate(950, 78)">
      <rect x="0" y="0" width="212" height="376" rx="28" fill="#18242b" stroke="#3c5a68" stroke-width="1.6"/>
      <rect x="8" y="8" width="196" height="360" rx="21" fill="#0d161b"/>
      <rect x="78" y="16" width="56" height="12" rx="6" fill="#060a0d"/>
      <circle cx="26" cy="44" r="4.5" fill="#7fe3c9"/>
      <text x="36" y="48" fill="#eef6f7" font-size="11.5" font-weight="700" class="sans">封面动态取色</text>

      <!-- Large Cover Preview -->
      <rect x="18" y="62" width="176" height="156" rx="14" fill="#15232b" stroke="#2c4552" stroke-width="1"/>
      <rect x="52" y="76" width="108" height="108" rx="14" fill="url(#vinyl2)"/>
      <g class="vinyl-spin">
        <circle cx="106" cy="130" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="16 8"/>
        <circle cx="106" cy="130" r="12" fill="#0d161b" stroke="#7fe3c9" stroke-width="2"/>
        <circle cx="106" cy="130" r="3.5" fill="#7fe3c9"/>
      </g>
      <text x="106" y="206" text-anchor="middle" fill="#7fe3c9" font-size="11.5" font-weight="700" class="sans">青柠夏夜 · Neon Balcony</text>

      <!-- Dynamic Color Swatches -->
      <rect x="18" y="230" width="176" height="118" rx="13" fill="#15232b" stroke="#2c4552" stroke-width="1"/>
      <text x="30" y="254" fill="#eef6f7" font-size="12" font-weight="700" class="sans">随专辑封面主色自适应</text>
      <text x="30" y="274" fill="#92aeb8" font-size="10.5" class="sans">切歌自动提取主题配色</text>
      <text x="30" y="292" fill="#92aeb8" font-size="10.5" class="sans">无封面时回退默认深绿主题</text>
      <circle cx="42" cy="322" r="10" fill="#7fe3c9" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="70" cy="322" r="10" fill="#2d6675" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle cx="98" cy="322" r="10" fill="#15232b" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>
      <rect x="120" y="310" width="62" height="24" rx="12" fill="#7fe3c9"/>
      <text x="151" y="326" text-anchor="middle" fill="#0d1b1e" font-size="10.5" font-weight="800" class="sans">已同步</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="20" fill="none" stroke="#2c3e32" stroke-width="1.5"/>
  </g>
</svg>
